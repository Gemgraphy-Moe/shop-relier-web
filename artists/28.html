<style>
  :root { --text:#4d4842; --text-soft:#968e84; --accent:#c5b3a3; --accent-deep:#9d8674; --bg:#faf7f3; }
  * { box-sizing:border-box; margin:0; padding:0; }
  body { font-family:"Shippori Mincho","Hiragino Mincho ProN","Yu Mincho",serif; color:var(--text); background:var(--bg); line-height:1.9; }
  a { color:var(--accent-deep); }
  .portfolio-container { max-width:720px; margin:0 auto; padding:48px 24px 80px; }
  .portfolio-back { display:inline-block; margin-bottom:32px; font-size:0.85rem; color:var(--text-soft); text-decoration:none; }
  .portfolio-header { text-align:center; margin-bottom:32px; }
  .portfolio-header .en { letter-spacing:0.2em; font-size:0.75rem; color:var(--accent-deep); }
  .portfolio-header h1 { font-size:2rem; font-weight:600; margin:8px 0 4px; }
  .portfolio-header h1 small { font-size:1rem; color:var(--text-soft); font-weight:400; }
  .portfolio-genre { display:inline-block; font-size:0.85rem; color:var(--accent-deep); border:1px solid var(--accent); border-radius:20px; padding:4px 16px; margin-top:8px; }
  .portfolio-hero { width:100%; max-height:520px; object-fit:cover; border-radius:6px; margin:32px 0; }
  .portfolio-gallery { display:grid; grid-template-columns:repeat(auto-fit, minmax(140px, 1fr)); gap:10px; margin-bottom:36px; }
  .portfolio-thumb img { width:100%; height:160px; object-fit:cover; border-radius:6px; }
  .portfolio-story p { margin-bottom:1.4em; font-size:1rem; }
  .portfolio-insta { display:inline-block; margin-top:24px; font-size:0.9rem; text-decoration:none; border-bottom:1px solid var(--accent); padding-bottom:2px; }
  @media (max-width:640px) {
    .portfolio-container { padding:32px 16px 60px; }
    .portfolio-header h1 { font-size:1.5rem; }
  }
</style>
